# racecoach run configuration (Path B: live SCR capture).
# Every [driver] key is a SimpleDriver field — the parameters the coach's
# code recommendations talk about.

[connection]
host = "localhost"
port = 3001       # scr_server bot 0 (3001 + bot index)
bot_id = "SCR"

[race]
run_name = "live"
max_laps = 3

[driver]
max_speed_kmh = 220.0
beam_speed_gain = 1.3
steer_angle_gain = 1.0
steer_pos_gain = 0.5
gear_up_rpm = 7500.0
gear_down_rpm = 3000.0
