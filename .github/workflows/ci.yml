name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (offscreen window + loader contract)
        run: pytest -v

      - name: Render window screenshot
        run: python scripts/screenshot.py apex-${{ matrix.os }}.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: apex-*.png
