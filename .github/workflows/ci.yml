name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # RUNNER_TEMP keeps the test workspace out of the checkout. It has to be
      # set here rather than in the job's env block: the runner context is not
      # available at that level, which made this whole file invalid.
      - name: Point the test workspace at the runner temp directory
        shell: bash
        run: echo "APEX_WORKSPACE=$RUNNER_TEMP/apex-workspace" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # libpulse0 decides whether QtMultimedia imports at all: it is the one
      # system library libQt6Multimedia.so.6 needs that the PySide6 wheel does
      # not ship. Without it every test of the footage review skips instead of
      # running, and two tests that needed a player reached main broken because
      # nothing here ever exercised them. The X11 three are for the FFmpeg media
      # plugin QMediaPlayer loads; FFmpeg itself is bundled in the wheel, so no
      # ffmpeg package belongs here.
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libpulse0 libx11-6 libxext6 libxrandr2

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (offscreen window + loader contract)
        run: pytest -v

      - name: Render Garage + Analysis screenshots
        run: python scripts/screenshot.py shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: shots/*.png
