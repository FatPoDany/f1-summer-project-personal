name: windows-installer

# Manual only. The job compiles the whole TORCS solution and bundles Apex, so
# it is far too heavy to run on every push, and it needs the pinned archive
# which is not tracked in this repository (.gitignore excludes /torcs-*.tar.*).
#
# .gitignore excludes the 563 MiB archive from the repository, so the job has to
# fetch it. Three sources, tried in this order:
#
#   1. The repository variable TORCS_ARCHIVE_URL, if set (Settings -> Secrets
#      and variables -> Actions -> Variables). Use this for a private mirror.
#   2. A release asset on this repository, if the archive_tag input is given.
#      The download uses the job's own GITHUB_TOKEN, so this works while the
#      repository is private, where a plain asset URL would return 404.
#   3. Upstream SourceForge (the default, so no configuration is needed). The
#      published torcs-1.3.9.tar.bz2 is byte-identical to the archive this
#      repository pins, confirmed by SHA-256.
#
# Whichever source is used, the archive is verified against the pinned hash
# before anything is built, so a moved, changed, or substituted tree fails the
# job with a clear error instead of reaching the installer.

on:
  workflow_dispatch:
    inputs:
      archive_tag:
        description: Optional release tag holding torcs-1.3.9.tar.bz2
        type: string
        default: ""
      configuration:
        description: MSVC configuration to build
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

jobs:
  installer:
    name: ApexStudySetup.exe
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TORCS_SHA256: f9c69e86d290295467451b01d7838d85005ba613644a6fe8a3f85a7c6a03cd4c
      ARCHIVE_PATH: ${{ github.workspace }}\torcs-1.3.9.tar.bz2
      ARCHIVE_NAME: torcs-1.3.9.tar.bz2
      UPSTREAM_URL: https://downloads.sourceforge.net/project/torcs/all-in-one/1.3.9/torcs-1.3.9.tar.bz2

    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned TORCS archive
        id: archive-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ARCHIVE_PATH }}
          key: torcs-archive-${{ env.TORCS_SHA256 }}

      # Configured values reach PowerShell through the environment, never through
      # template interpolation into the script body.
      - name: Download the pinned TORCS archive
        if: steps.archive-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          TORCS_ARCHIVE_URL: ${{ vars.TORCS_ARCHIVE_URL }}
          ARCHIVE_TAG: ${{ inputs.archive_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:TORCS_ARCHIVE_URL) {
            Write-Host 'Fetching the archive from TORCS_ARCHIVE_URL'
            Invoke-WebRequest -Uri $env:TORCS_ARCHIVE_URL `
              -OutFile $env:ARCHIVE_PATH -MaximumRedirection 5
          } elseif ($env:ARCHIVE_TAG) {
            # gh is preinstalled on GitHub runners and authenticates with
            # GITHUB_TOKEN, so this also works while the repository is private.
            Write-Host "Fetching $env:ARCHIVE_NAME from release $env:ARCHIVE_TAG"
            gh release download $env:ARCHIVE_TAG `
              --repo '${{ github.repository }}' `
              --pattern $env:ARCHIVE_NAME `
              --output $env:ARCHIVE_PATH --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Could not download $env:ARCHIVE_NAME from release $env:ARCHIVE_TAG."
              Write-Host 'Check the tag exists and the archive is attached to it as an asset.'
              exit 1
            }
          } else {
            Write-Host 'Fetching the archive from upstream SourceForge'
            # SourceForge answers with a mirror redirect before the payload.
            Invoke-WebRequest -Uri $env:UPSTREAM_URL `
              -OutFile $env:ARCHIVE_PATH -MaximumRedirection 5
          }

      - name: Verify the archive hash
        shell: pwsh
        run: |
          $actual = (Get-FileHash -LiteralPath $env:ARCHIVE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TORCS_SHA256) {
            Write-Host "::error::Archive hash mismatch. Expected $env:TORCS_SHA256, got $actual"
            Write-Host 'If upstream has moved or replaced the file, attach the pinned archive to a'
            Write-Host 'release and re-run with archive_tag set, or point TORCS_ARCHIVE_URL at a mirror.'
            exit 1
          }
          Write-Host "Archive verified: $env:TORCS_SHA256"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build TORCS, Apex, and the installer
        shell: pwsh
        env:
          BUILD_ROOT: ${{ runner.temp }}\apex-torcs-win
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          .\integrations\torcs-1.3.9\build-windows.ps1 `
            -Archive $env:ARCHIVE_PATH `
            -BuildRoot $env:BUILD_ROOT `
            -Configuration $env:BUILD_CONFIGURATION

      - name: Report installer size
        shell: pwsh
        run: |
          $installer = "${{ runner.temp }}\apex-torcs-win\dist\ApexStudySetup.exe"
          $size = [math]::Round((Get-Item -LiteralPath $installer).Length / 1MB, 1)
          Write-Host "::notice::ApexStudySetup.exe is $size MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ApexStudySetup
          path: ${{ runner.temp }}\apex-torcs-win\dist\ApexStudySetup.exe
          if-no-files-found: error
          retention-days: 30
